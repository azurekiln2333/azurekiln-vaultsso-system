<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="/assets/vaultsso-fonts.css">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="auth.mfa.title">二步验证</title>
  <link rel="stylesheet" href="/css/vaultsso-base.css?v=20261025-icon-font-1">
  <link rel="stylesheet" href="/css/vaultsso-mfa.css?v=20261024-email-gate-2">
  <script src="/js/shared/icon-font.js?v=20261025-icon-font-1" defer></script>
</head>
<body class="mfa-page">
  <header class="mfa-header">
    <span class="mfa-brand">VaultSSO</span>
    <details id="languageMenu" class="mfa-language">
      <summary data-i18n-title="auth.mfa.language" title="选择语言" aria-label="选择语言">
        <span class="material-symbols-outlined" aria-hidden="true">language</span>
      </summary>
      <div class="mfa-language-options">
        <button type="button" data-language-switch="zh" lang="zh-CN">简体中文</button>
        <button type="button" data-language-switch="zh-TW" lang="zh-TW">繁體中文</button>
        <button type="button" data-language-switch="en" lang="en">English</button>
      </div>
    </details>
  </header>
  <main class="mfa-main">
    <section class="mfa-card" aria-labelledby="mfaTitle">
      <div class="mfa-intro">
        <div class="mfa-lock" aria-hidden="true">
          <span class="material-symbols-outlined">enhanced_encryption</span>
        </div>
        <h1 id="mfaTitle" data-i18n="auth.mfa.title">二步验证</h1>
        <p id="instructions" data-i18n="common.loading">加载中...</p>
      </div>
      <form id="mfaForm">
        <div id="emailGateControls" hidden>
          <p id="emailGateMasked" class="mfa-gate-target"></p>
          <label id="bindEmailLabel" class="mfa-gate-label" for="bindEmailInput" data-i18n="auth.email_gate.bind_label" hidden>新邮箱</label>
          <input id="bindEmailInput" class="mfa-gate-input" name="bind_email" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" data-i18n-placeholder="auth.email_gate.bind_placeholder" placeholder="name@company.com" disabled hidden>
          <button id="sendEmailGateCodeBtn" class="mfa-gate-send" type="button" data-i18n="auth.email_gate.send" disabled>发送验证码</button>
        </div>
        <label id="codeLabel" class="mfa-code-label" for="code" data-i18n="auth.login_code.label">邮箱验证码</label>
        <div id="codeEntry" class="mfa-code-entry">
          <div class="mfa-code-slots" aria-hidden="true">
            <span class="mfa-code-slot" data-code-slot></span>
            <span class="mfa-code-slot" data-code-slot></span>
            <span class="mfa-code-slot" data-code-slot></span>
            <span class="mfa-code-slot" data-code-slot></span>
            <span class="mfa-code-slot" data-code-slot></span>
            <span class="mfa-code-slot" data-code-slot></span>
          </div>
          <input id="code" name="verificationcode" type="text" inputmode="numeric" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" maxlength="6" aria-describedby="instructions" required disabled>
        </div>
        <button id="submit" class="mfa-submit" type="submit" data-i18n="auth.mfa.submit" disabled>验证并登录</button>
        <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
        <div class="mfa-actions">
          <a id="backLogin" href="/oauth2/authorize">
            <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
            <span data-i18n="common.action.back_signin">返回登录页</span>
          </a>
          <button id="recoveryToggle" type="button" data-i18n="auth.mfa.use_recovery" aria-pressed="false" disabled hidden>使用恢复码</button>
        </div>
      </form>
    </section>
  </main>
  <script src="/js/shared/i18n.js?v=20261026-session-duration-1" defer></script>
  <script src="/js/pages/auth/mfa.js?v=20261024-email-gate-3" defer></script>
</body>
</html>
