<!DOCTYPE html>
<html class="light" lang="zh-CN" data-admin-page="smtp">
<head>
  <link rel="stylesheet" href="/assets/vaultsso-fonts.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultSSO | 发件设置</title>
  <link rel="stylesheet" href="/css/vaultsso-utilities.css">
  <link rel="stylesheet" href="/css/vaultsso-base.css?v=20261025-icon-font-1">
  <link rel="stylesheet" href="/css/vaultsso-admin.css?v=20261021-admin-flat-1">
  <link rel="stylesheet" href="/css/vaultsso-admin-pages.css?v=20261021-admin-flat-1">
  <script src="/js/shared/i18n.js?v=20261026-session-duration-1"></script>
  <script src="/js/shared/admin-shell.js?v=20260928-js-1" defer></script>
  <script src="/js/shared/icon-font.js?v=20261025-icon-font-1" defer></script>
</head>
<body class="vaultsso-page-surface min-h-screen text-ink">
  <div class="admin-main mx-auto max-w-7xl px-6 py-6">
    <div class="napi-page-header">
      <p class="napi-page-desc admin-page-desc">配置用于发送验证码邮件的 SMTP 服务。设置保存后立即生效，重启后仍然保留。443 / 465 端口自动使用隐式 TLS，其余端口使用 STARTTLS。</p>
      <button class="napi-btn napi-btn-primary" form="smtpForm" id="saveBtn" type="submit"><span class="material-symbols-outlined">save</span>保存设置</button>
    </div>

    <div class="admin-status admin-status-info mb-4" id="statusBar">正在加载发件设置...</div>

    <div class="grid grid-cols-1 gap-5 lg:grid-cols-3">
      <section class="lg:col-span-2">
        <article class="napi-panel">
          <div class="napi-panel-head">
            <div>
              <h2 class="napi-panel-title">SMTP 配置</h2>
              <p class="napi-panel-desc">服务器地址与身份凭据，保存后立即用于发送验证码邮件。</p>
            </div>
            <span class="material-symbols-outlined admin-panel-icon">settings</span>
          </div>
          <div class="napi-panel-body">
            <form id="smtpForm">
              <div class="admin-form-grid">
                <label class="napi-field admin-span-2">
                  <span class="napi-label">SMTP 主机</span>
                  <input class="napi-input" id="hostInput" placeholder="mail.smtp2go.com" type="text">
                </label>
                <label class="napi-field">
                  <span class="napi-label">端口</span>
                  <input class="napi-input" id="portInput" placeholder="443" type="number" min="1" max="65535">
                </label>
                <label class="napi-field">
                  <span class="napi-label">用户名</span>
                  <input class="napi-input" id="userInput" autocomplete="off" type="text">
                </label>
                <label class="napi-field admin-span-2">
                  <span class="napi-label">发件地址（MAIL_FROM）</span>
                  <input class="napi-input" id="fromInput" placeholder="VaultSSO <no-reply@yourdomain.com>" type="text">
                </label>
                <label class="napi-field admin-span-3">
                  <span class="napi-label">SMTP 密码</span>
                  <input class="napi-input" id="passwordInput" autocomplete="new-password" placeholder="留空表示不修改已保存的密码" type="password">
                  <span class="napi-hint" id="passwordHint"></span>
                </label>
              </div>
              <label class="admin-check-row">
                <input class="admin-checkbox" id="clearPassword" type="checkbox">
                <span>清除已保存的密码</span>
              </label>
            </form>
          </div>
        </article>
      </section>

      <section class="space-y-5">
        <article class="napi-panel">
          <div class="napi-panel-head">
            <div>
              <h2 class="napi-panel-title">发送测试邮件</h2>
              <p class="napi-panel-desc">保存后向任意邮箱发信，确认配置可用。</p>
            </div>
            <span class="material-symbols-outlined admin-panel-icon">send</span>
          </div>
          <div class="napi-panel-body">
            <label class="napi-field">
              <span class="napi-label">收件邮箱</span>
              <input class="napi-input" id="testToInput" placeholder="you@example.com" type="email">
            </label>
            <button class="napi-btn napi-btn-secondary admin-btn-block mt-3" id="testBtn" type="button"><span class="material-symbols-outlined">forward_to_inbox</span>发送测试邮件</button>
          </div>
        </article>

        <article class="napi-panel">
          <div class="napi-panel-head">
            <h2 class="napi-panel-title">当前状态</h2>
            <span class="material-symbols-outlined admin-panel-icon">info</span>
          </div>
          <div class="napi-panel-body admin-state-list">
            <div class="napi-setting-row"><span class="napi-setting-label">主机</span><span class="napi-setting-value" id="stateHost">-</span></div>
            <div class="napi-setting-row"><span class="napi-setting-label">用户名</span><span class="napi-setting-value" id="stateUser">-</span></div>
            <div class="napi-setting-row"><span class="napi-setting-label">密码</span><span class="napi-setting-value" id="statePassword">-</span></div>
          </div>
        </article>
      </section>
    </div>
  </div>

  <script src="/js/pages/admin/smtp.js?v=20261026-smtp-errors-1"></script>
</body>
</html>
