<!DOCTYPE html>
<html class="light" lang="zh-CN" data-admin-page="smtp">
<head>
  <link rel="stylesheet" href="/assets/vaultsso-fonts.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultSSO | 发件设置</title>
  <link rel="stylesheet" href="/css/vaultsso-utilities.css">
  <link rel="stylesheet" href="/css/vaultsso-base.css">
  <link rel="stylesheet" href="/css/vaultsso-admin.css">
  <script src="/js/shared/i18n.js?v=20260928-js-1"></script>
  <script src="/js/shared/admin-shell.js?v=20260928-js-1" defer></script>
</head>
<body class="vaultsso-page-surface min-h-screen text-ink">
  <div class="admin-main mx-auto max-w-7xl px-6 py-6 lg:px-8">
    <section class="mb-8 rounded-xl bg-surface-container-low p-8">
      <div class="flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between">
        <div>
          <p class="mb-4 inline-flex items-center gap-2 rounded-lg bg-primary-soft px-4 py-2 text-xs font-bold uppercase tracking-widest text-primary">
            <span class="material-symbols-outlined text-base">outgoing_mail</span> 管理员控制台
          </p>
          <h1 class="font-headline text-4xl font-extrabold tracking-tight">发件设置</h1>
          <p class="mt-3 max-w-3xl text-base leading-8 text-muted">配置用于发送验证码邮件的 SMTP 服务。设置保存后立即生效，重启后仍然保留。443 / 465 端口自动使用隐式 TLS，其余端口使用 STARTTLS。</p>
        </div>
        <button class="inline-flex shrink-0 items-center gap-2 self-start rounded-lg bg-primary px-5 py-3 text-sm font-bold text-white hover:opacity-90 disabled:opacity-50 lg:self-center" form="smtpForm" id="saveBtn" type="submit"><span class="material-symbols-outlined text-lg">save</span>保存设置</button>
      </div>
    </section>

    <div class="mb-6 rounded-lg border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-blue-700" id="statusBar">正在加载发件设置...</div>

    <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
      <section class="lg:col-span-2">
        <article class="rounded-xl bg-white p-6 shadow-sm">
          <p class="mb-5 inline-flex items-center gap-2 text-sm font-bold text-muted"><span class="material-symbols-outlined text-lg">settings</span>SMTP 配置</p>
          <form class="space-y-5" id="smtpForm">
            <div class="grid grid-cols-1 gap-5 sm:grid-cols-3">
              <label class="block sm:col-span-2">
                <span class="mb-1 block text-sm font-bold text-muted">SMTP 主机</span>
                <input class="w-full rounded-lg border-line text-sm" id="hostInput" placeholder="mail.smtp2go.com" type="text">
              </label>
              <label class="block">
                <span class="mb-1 block text-sm font-bold text-muted">端口</span>
                <input class="w-full rounded-lg border-line text-sm" id="portInput" placeholder="443" type="number" min="1" max="65535">
              </label>
              <label class="block">
                <span class="mb-1 block text-sm font-bold text-muted">用户名</span>
                <input class="w-full rounded-lg border-line text-sm" id="userInput" autocomplete="off" type="text">
              </label>
              <label class="block sm:col-span-2">
                <span class="mb-1 block text-sm font-bold text-muted">发件地址（MAIL_FROM）</span>
                <input class="w-full rounded-lg border-line text-sm" id="fromInput" placeholder="VaultSSO <no-reply@yourdomain.com>" type="text">
              </label>
              <label class="block sm:col-span-3">
                <span class="mb-1 block text-sm font-bold text-muted">SMTP 密码</span>
                <input class="w-full rounded-lg border-line text-sm" id="passwordInput" autocomplete="new-password" placeholder="留空表示不修改已保存的密码" type="password">
                <span class="mt-1 block text-xs text-muted" id="passwordHint"></span>
                <span class="mt-3 flex items-center gap-2 text-sm text-muted"><input class="h-4 w-4 accent-primary" id="clearPassword" type="checkbox">清除已保存的密码</span>
              </label>
            </div>
            <p class="text-xs text-muted">修改后点击页面右上角的「保存设置」即可生效。</p>
          </form>
        </article>
      </section>

      <section>
        <article class="rounded-xl bg-white p-6 shadow-sm">
          <p class="mb-4 inline-flex items-center gap-2 text-sm font-bold text-muted"><span class="material-symbols-outlined text-lg">send</span>发送测试邮件</p>
          <p class="mb-4 text-xs leading-5 text-muted">保存设置后，向任意邮箱发送一封测试邮件，确认 SMTP 配置可用。</p>
          <label class="block">
            <span class="mb-1 block text-sm font-bold text-muted">收件邮箱</span>
            <input class="w-full rounded-lg border-line text-sm" id="testToInput" placeholder="you@example.com" type="email">
          </label>
          <button class="mt-4 inline-flex w-full items-center justify-center gap-2 rounded-lg border border-line px-4 py-3 text-sm font-bold text-muted hover:text-primary disabled:opacity-50" id="testBtn" type="button"><span class="material-symbols-outlined text-lg">forward_to_inbox</span>发送测试邮件</button>
        </article>

        <article class="mt-6 rounded-xl bg-white p-6 shadow-sm">
          <p class="mb-3 inline-flex items-center gap-2 text-sm font-bold text-muted"><span class="material-symbols-outlined text-lg">info</span>当前状态</p>
          <ul class="space-y-2 text-sm text-muted">
            <li id="stateHost" class="flex items-center gap-2"><span class="material-symbols-outlined text-base">dns</span>-</li>
            <li id="stateUser" class="flex items-center gap-2"><span class="material-symbols-outlined text-base">badge</span>-</li>
            <li id="statePassword" class="flex items-center gap-2"><span class="material-symbols-outlined text-base">key</span>-</li>
          </ul>
        </article>
      </section>
    </div>
  </div>

  <script src="/js/pages/admin/smtp.js?v=20260928-js-1"></script>
</body>
</html>
