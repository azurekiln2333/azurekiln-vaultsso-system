<!DOCTYPE html>
<html class="light" lang="zh-CN" data-admin-page="users">
<head>
  <link rel="stylesheet" href="/assets/vaultsso-fonts.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultSSO | 用户详情</title>
  <link rel="stylesheet" href="/css/vaultsso-utilities.css">
  <link rel="stylesheet" href="/css/vaultsso-base.css">
  <link rel="stylesheet" href="/css/vaultsso-admin.css">
  <script src="/js/shared/i18n.js?v=20260928-js-1"></script>
  <script src="/js/shared/admin-shell.js?v=20260928-js-1" defer></script>
</head>
<body class="vaultsso-page-surface min-h-screen text-ink">
  <div class="admin-main mx-auto max-w-7xl px-6 py-6 lg:px-8">
    <section class="mb-6">
      <a class="mb-4 inline-flex items-center gap-1 text-sm font-bold text-muted hover:text-primary" href="/users.html"><span class="material-symbols-outlined text-lg">arrow_back</span>返回用户列表</a>
      <h1 class="font-headline text-3xl font-extrabold tracking-tight">用户详情</h1>
      <p class="mt-2 text-base text-muted">查看并编辑该账户的基本资料、角色和邮箱验证状态。</p>
    </section>

    <div class="mb-6 rounded-lg border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-blue-700" id="statusBar">正在加载用户信息...</div>

    <div class="grid grid-cols-1 gap-6 lg:grid-cols-5">
      <section class="space-y-5 lg:col-span-2">
        <article class="rounded-xl bg-white p-6 shadow-sm">
          <div class="flex items-center gap-4">
            <img class="h-20 w-20 rounded-2xl object-cover bg-primary-soft" id="detailAvatar" alt="avatar">
            <div class="min-w-0">
              <p class="font-headline truncate text-2xl font-extrabold tracking-tight" id="detailName">...</p>
              <p class="mt-1 break-all text-sm text-muted" id="detailUsername"></p>
            </div>
          </div>
          <div class="mt-4 flex flex-wrap gap-2">
            <span class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-bold" id="roleBadge"></span>
            <span class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-bold" id="verifiedBadge"></span>
            <span class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-bold" id="bannedBadge"></span>
            <span class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-bold" id="totpBadge"></span>
            <span class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-bold" id="captchaBadge"></span>
          </div>
          <button class="mt-4 inline-flex items-center gap-1 rounded-lg border border-line bg-white px-3 py-2 text-xs font-bold text-muted hover:text-primary hidden" id="totpResetBtn" type="button"><span class="material-symbols-outlined text-sm">phonelink_erase</span>重置验证器</button>
          <button class="mt-4 inline-flex items-center gap-1 rounded-lg border border-line bg-white px-3 py-2 text-xs font-bold text-muted hover:text-primary" id="revokeSessionsBtn" type="button"><span class="material-symbols-outlined text-sm">logout</span>强制退出所有设备</button>
          <button class="mt-4 inline-flex items-center gap-1 rounded-lg border border-line bg-white px-3 py-2 text-xs font-bold text-muted hover:text-primary hidden" id="captchaClearBtn" type="button"><span class="material-symbols-outlined text-sm">shield</span>清除强制验证码标记</button>
          <code class="mt-4 block break-all rounded-lg bg-surface-container-low px-3 py-2 text-xs text-muted" id="detailId"></code>
        </article>

        <article class="rounded-xl bg-white p-6 shadow-sm">
          <p class="mb-4 inline-flex items-center gap-2 text-sm font-bold text-muted"><span class="material-symbols-outlined text-lg">link</span>第三方账号绑定</p>
          <div class="space-y-2" id="identityList"></div>
        </article>

        <article class="grid grid-cols-1 gap-4 sm:grid-cols-3">
          <div class="rounded-xl bg-white p-4 shadow-sm">
            <p class="mb-1 text-xs font-bold uppercase tracking-widest text-muted">创建时间</p>
            <p class="text-sm font-semibold" id="detailCreatedAt">-</p>
          </div>
          <div class="rounded-xl bg-white p-4 shadow-sm">
            <p class="mb-1 text-xs font-bold uppercase tracking-widest text-muted">最近更新</p>
            <p class="text-sm font-semibold" id="detailUpdatedAt">-</p>
          </div>
          <div class="rounded-xl bg-white p-4 shadow-sm">
            <p class="mb-1 text-xs font-bold uppercase tracking-widest text-muted">最后登录 IP</p>
            <p class="text-sm font-semibold break-all" id="detailLastLoginIp">-</p>
          </div>
        </article>
      </section>

      <section class="lg:col-span-3">
        <article class="rounded-xl bg-white p-6 shadow-sm">
          <p class="mb-5 inline-flex items-center gap-2 text-sm font-bold text-muted"><span class="material-symbols-outlined text-lg">edit</span>编辑资料</p>
          <form class="space-y-5" id="userEditForm">
            <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
              <label class="block">
                <span class="mb-1 block text-sm font-bold text-muted">显示名称</span>
                <input class="w-full rounded-lg border-line text-sm" id="nameInput" name="name" type="text" required>
              </label>
              <label class="block">
                <span class="mb-1 block text-sm font-bold text-muted">邮箱</span>
                <input class="w-full rounded-lg border-line text-sm" id="emailInput" name="email" type="email" required>
              </label>
              <label class="block">
                <span class="mb-1 block text-sm font-bold text-muted">国家/地区代码</span>
                <input class="w-full rounded-lg border-line text-sm" id="phoneCountryInput" name="phoneCountryCode" type="tel" autocomplete="tel-country-code" maxlength="8" placeholder="+86" required>
              </label>
              <div>
                <label class="block" for="phoneInput"><span class="mb-1 block text-sm font-bold text-muted">手机号</span></label>
                <input class="w-full rounded-lg border-line text-sm" id="phoneInput" name="phoneNumber" type="tel" autocomplete="tel-national" maxlength="32">
                <div class="mt-2 flex flex-wrap items-center gap-3">
                  <span class="text-xs text-muted" id="phoneStatus"></span>
                  <button class="inline-flex items-center gap-1 text-xs font-bold text-red-600" id="phoneClearBtn" type="button"><span class="material-symbols-outlined text-sm">link_off</span>解除绑定</button>
                </div>
              </div>
              <p class="text-xs text-muted sm:col-span-2">修改手机号后将清除验证状态；留空并保存可解除绑定。</p>
              <label class="block sm:col-span-2">
                <span class="mb-1 block text-sm font-bold text-muted">头像 URL</span>
                <input class="w-full rounded-lg border-line text-sm" id="avatarInput" name="avatar" type="url" placeholder="https://example.com/avatar.png">
                <span class="mt-1 block text-xs text-muted">留空将使用系统默认头像。</span>
              </label>
              <label class="block sm:col-span-2">
                <span class="mb-1 block text-sm font-bold text-muted">个人简介</span>
                <textarea class="w-full rounded-lg border-line text-sm" id="descriptionInput" name="description" rows="3" maxlength="500"></textarea>
                <span class="mt-1 block text-xs text-muted">最多 500 字。</span>
              </label>
              <label class="block">
                <span class="mb-1 block text-sm font-bold text-muted">角色</span>
                <select class="w-full rounded-lg border-line py-2.5 pl-3 pr-9 text-sm" id="roleInput" name="role">
                  <option value="user">普通用户</option>
                  <option value="admin">管理员</option>
                </select>
              </label>
              <label class="block">
                <span class="mb-1 block text-sm font-bold text-muted">积分</span>
                <input class="w-full rounded-lg border-line text-sm" id="creditsInput" name="credits" type="number" min="0" step="1">
              </label>
              <label class="flex items-center gap-3 self-end pb-2">
                <input class="h-4 w-4 rounded accent-primary" id="verifiedInput" name="emailVerified" type="checkbox">
                <span class="text-sm font-bold text-muted">邮箱已验证</span>
              </label>
              <label class="flex flex-wrap items-center gap-3 sm:col-span-2">
                <input class="h-4 w-4 rounded accent-red-600" id="bannedInput" name="banned" type="checkbox">
                <span class="text-sm font-bold text-muted">封禁该账户</span>
                <span class="text-xs text-muted">封禁后该用户将无法登录系统。</span>
              </label>
            </div>
            <div class="rounded-lg bg-surface-container-low px-4 py-3 text-xs text-muted">用户名 <span id="usernameHint" class="font-bold"></span> 已锁定，无法修改。</div>
            <button class="inline-flex items-center gap-2 rounded-lg bg-primary px-5 py-3 text-sm font-bold text-white hover:opacity-90 disabled:opacity-50" id="saveBtn" type="submit"><span class="material-symbols-outlined text-lg">save</span>保存修改</button>
          </form>
        </article>
      </section>
    </div>
  </div>

  <script src="/js/pages/admin/user.js?v=20260928-js-1"></script>
</body>
</html>
