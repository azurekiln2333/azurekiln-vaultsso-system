<!DOCTYPE html>
<html class="light" lang="zh-CN" data-admin-page="users">
<head>
  <link rel="stylesheet" href="/assets/vaultsso-fonts.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultSSO | 用户详情</title>
  <link rel="stylesheet" href="/css/vaultsso-utilities.css">
  <link rel="stylesheet" href="/css/vaultsso-base.css?v=20261025-icon-font-1">
  <link rel="stylesheet" href="/css/vaultsso-admin.css?v=20261021-admin-flat-1">
  <link rel="stylesheet" href="/css/vaultsso-admin-pages.css?v=20261021-admin-flat-1">
  <script src="/js/shared/i18n.js?v=20261026-session-duration-1"></script>
  <script src="/js/shared/admin-shell.js?v=20260928-js-1" defer></script>
  <script src="/js/shared/icon-font.js?v=20261025-icon-font-1" defer></script>
</head>
<body class="vaultsso-page-surface min-h-screen text-ink">
  <div class="admin-main mx-auto max-w-7xl px-6 py-6">
    <div class="napi-page-header">
      <div class="admin-page-head-copy">
        <a class="admin-back-link" href="/users.html"><span class="material-symbols-outlined">arrow_back</span>返回用户列表</a>
        <p class="napi-page-desc admin-page-desc">查看并编辑该账户的基本资料、角色和邮箱验证状态。</p>
      </div>
    </div>

    <div class="admin-status admin-status-info mb-4" id="statusBar">正在加载用户信息...</div>

    <div class="grid grid-cols-1 gap-6 lg:grid-cols-5">
      <section class="space-y-5 lg:col-span-2">
        <article class="napi-panel"><div class="napi-panel-body">
          <div class="flex items-center gap-4">
            <img class="h-20 w-20 rounded-full object-cover bg-primary-soft" id="detailAvatar" alt="avatar">
            <div class="min-w-0">
              <p class="napi-page-title truncate" id="detailName">...</p>
              <p class="admin-cell-sub" id="detailUsername"></p>
            </div>
          </div>
          <div class="mt-4 flex flex-wrap gap-2">
            <span class="napi-badge" id="roleBadge"></span>
            <span class="napi-badge" id="verifiedBadge"></span>
            <span class="napi-badge" id="bannedBadge"></span>
            <span class="napi-badge" id="totpBadge"></span>
            <span class="napi-badge" id="captchaBadge"></span>
          </div>
          <button class="napi-btn napi-btn-secondary napi-btn-sm hidden" id="totpResetBtn" type="button"><span class="material-symbols-outlined text-sm">phonelink_erase</span>重置验证器</button>
          <button class="napi-btn napi-btn-secondary napi-btn-sm" id="revokeSessionsBtn" type="button"><span class="material-symbols-outlined text-sm">logout</span>强制退出所有设备</button>
          <button class="napi-btn napi-btn-secondary napi-btn-sm hidden" id="captchaClearBtn" type="button"><span class="material-symbols-outlined text-sm">shield</span>清除强制验证码标记</button>
          <code class="admin-code-block mt-4" id="detailId"></code>
        </div></article>

        <article class="napi-panel"><div class="napi-panel-body">
          <p class="napi-panel-title"><span class="material-symbols-outlined text-lg">link</span>第三方账号绑定</p>
          <div class="space-y-2" id="identityList"></div>
        </div></article>

        <article class="admin-stat-grid admin-stat-grid-3">
          <div class="admin-stat">
            <p class="admin-stat-label">创建时间</p>
            <p class="admin-stat-value admin-stat-value-sm" id="detailCreatedAt">-</p>
          </div>
          <div class="admin-stat">
            <p class="admin-stat-label">最近更新</p>
            <p class="admin-stat-value admin-stat-value-sm" id="detailUpdatedAt">-</p>
          </div>
          <div class="admin-stat">
            <p class="admin-stat-label">最后登录 IP</p>
            <p class="admin-stat-value admin-stat-value-sm" id="detailLastLoginIp">-</p>
          </div>
        </article>
      </section>

      <section class="lg:col-span-3">
        <article class="napi-panel"><div class="napi-panel-body">
          <p class="napi-panel-title"><span class="material-symbols-outlined text-lg">edit</span>编辑资料</p>
          <form class="space-y-5" id="userEditForm">
            <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
              <label class="block">
                <span class="napi-label">显示名称</span>
                <input class="napi-input" id="nameInput" name="name" type="text" required>
              </label>
              <label class="block">
                <span class="napi-label">邮箱</span>
                <input class="napi-input" id="emailInput" name="email" type="email" required>
              </label>
              <label class="block">
                <span class="napi-label">国家/地区代码</span>
                <input class="napi-input" id="phoneCountryInput" name="phoneCountryCode" type="tel" autocomplete="tel-country-code" maxlength="8" placeholder="+86" required>
              </label>
              <div>
                <label class="block" for="phoneInput"><span class="napi-label">手机号</span></label>
                <input class="napi-input" id="phoneInput" name="phoneNumber" type="tel" autocomplete="tel-national" maxlength="32">
                <div class="mt-2 flex flex-wrap items-center gap-3">
                  <span class="text-xs text-muted" id="phoneStatus"></span>
                  <button class="inline-flex items-center gap-1 text-xs font-bold text-red-600" id="phoneClearBtn" type="button"><span class="material-symbols-outlined text-sm">link_off</span>解除绑定</button>
                </div>
              </div>
              <p class="text-xs text-muted sm:col-span-2">修改手机号后将清除验证状态；留空并保存可解除绑定。</p>
              <label class="block sm:col-span-2">
                <span class="napi-label">头像 URL</span>
                <input class="napi-input" id="avatarInput" name="avatar" type="url" placeholder="https://example.com/avatar.png">
                <span class="napi-hint">留空将使用系统默认头像。</span>
              </label>
              <label class="block sm:col-span-2">
                <span class="napi-label">个人简介</span>
                <textarea class="napi-input" id="descriptionInput" name="description" rows="3" maxlength="500"></textarea>
                <span class="napi-hint">最多 500 字。</span>
              </label>
              <label class="block">
                <span class="napi-label">角色</span>
                <select class="napi-select" id="roleInput" name="role">
                  <option value="user">普通用户</option>
                  <option value="admin">管理员</option>
                </select>
              </label>
              <label class="block">
                <span class="napi-label">积分</span>
                <input class="napi-input" id="creditsInput" name="credits" type="number" min="0" step="1">
              </label>
              <label class="flex items-center gap-3 self-end pb-2">
                <input class="admin-checkbox" id="verifiedInput" name="emailVerified" type="checkbox">
                <span class="text-sm font-bold text-muted">邮箱已验证</span>
              </label>
              <label class="flex flex-wrap items-center gap-3 sm:col-span-2">
                <input class="admin-checkbox" id="bannedInput" name="banned" type="checkbox">
                <span class="text-sm font-bold text-muted">封禁该账户</span>
                <span class="text-xs text-muted">封禁后该用户将无法登录系统。</span>
              </label>
            </div>
            <div class="admin-note mt-3">用户名 <span id="usernameHint" class="font-bold"></span> 已锁定，无法修改。</div>
            <button class="napi-btn napi-btn-primary" id="saveBtn" type="submit"><span class="material-symbols-outlined text-lg">save</span>保存修改</button>
          </form>
        </div></article>
      </section>
    </div>
  </div>

  <script src="/js/pages/admin/user.js?v=20260928-js-1"></script>
</body>
</html>
