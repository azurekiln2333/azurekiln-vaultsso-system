<!DOCTYPE html>
<html class="light" lang="zh-CN" data-admin-page="tokens">
<head>
  <link rel="stylesheet" href="/assets/vaultsso-fonts.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="tokens.page.title">VaultSSO | 令牌审计</title>
  <link rel="stylesheet" href="/css/vaultsso-utilities.css">
  <link rel="stylesheet" href="/css/vaultsso-base.css">
  <link rel="stylesheet" href="/css/vaultsso-admin.css">
  <link rel="stylesheet" href="/css/vaultsso-admin-pages.css">
  <script src="/js/shared/admin-shell.js?v=20260928-js-1" defer></script>
</head>
<body class="vaultsso-page-surface min-h-screen text-ink">
  <div class="admin-main mx-auto max-w-7xl px-6 py-6 lg:px-8">
    <div class="napi-page-header">
      <p class="napi-page-desc admin-page-desc" data-i18n="tokens.hero.description">查看已签发的访问令牌、检查过期状态、按条件筛选，并吊销仍在生效的令牌。</p>
    </div>

    <section class="admin-stat-grid mb-4">
      <article class="admin-stat">
        <p class="admin-stat-label" data-i18n="tokens.stats.total">令牌总数</p>
        <p class="admin-stat-value" id="statsTotal">0</p>
      </article>
      <article class="admin-stat">
        <p class="admin-stat-label" data-i18n="tokens.stats.active">生效中</p>
        <p class="admin-stat-value" id="statsActive">0</p>
      </article>
      <article class="admin-stat">
        <p class="admin-stat-label" data-i18n="tokens.stats.expiring">24 小时内过期</p>
        <p class="admin-stat-value" id="statsExpiring">0</p>
      </article>
      <article class="admin-stat">
        <p class="admin-stat-label" data-i18n="tokens.stats.expired">已过期</p>
        <p class="admin-stat-value" id="statsExpired">0</p>
      </article>
    </section>

    <div class="admin-toolbar-card mb-4">
      <div class="admin-toolbar-row">
        <label class="admin-search">
          <span class="material-symbols-outlined" aria-hidden="true">search</span>
          <input class="napi-input" id="searchInput" data-i18n-placeholder="tokens.search.placeholder" placeholder="搜索用户、客户端、scope 或令牌 ID" type="search">
        </label>
        <button class="napi-btn napi-btn-secondary napi-btn-sm" id="refreshBtn" type="button">
          <span class="material-symbols-outlined">refresh</span>
          <span data-i18n="common.action.refresh">刷新</span>
        </button>
      </div>
    </div>

    <div class="admin-status admin-status-info mb-4" id="statusBar" data-i18n="tokens.status.loading">正在从 /api/tokens 加载令牌...</div>

    <section class="admin-table-panel">
      <div class="napi-table-scroll">
        <table class="napi-table">
          <thead>
            <tr>
              <th data-i18n="tokens.table.client">客户端</th>
              <th data-i18n="tokens.table.user">用户</th>
              <th data-i18n="tokens.table.scopes">Scopes</th>
              <th data-i18n="tokens.table.created">创建时间</th>
              <th data-i18n="tokens.table.expires">过期时间</th>
              <th data-i18n="tokens.table.status">状态</th>
              <th data-i18n="tokens.table.token_id">令牌 ID</th>
              <th class="text-right" data-i18n="tokens.table.action">操作</th>
            </tr>
          </thead>
          <tbody id="tokenTableBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/js/shared/i18n.js?v=20260928-js-1"></script>
  <script src="/js/pages/admin/tokens.js?v=20260928-js-1"></script>
</body>
</html>
