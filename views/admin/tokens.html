<!DOCTYPE html>
<html class="light" lang="zh-CN" data-admin-page="tokens">
<head>
  <link rel="stylesheet" href="/assets/vaultsso-fonts.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="tokens.page.title">VaultSSO | 令牌审计</title>
  <link rel="stylesheet" href="/css/vaultsso-utilities.css">
  <link rel="stylesheet" href="/css/vaultsso-base.css">
  <link rel="stylesheet" href="/css/vaultsso-admin.css">
  <script src="/js/shared/admin-shell.js?v=20260928-js-1" defer></script>
</head>
<body class="vaultsso-page-surface min-h-screen text-ink">
  <div class="admin-main mx-auto max-w-7xl px-6 py-6 lg:px-8">
    <section class="mb-8 rounded-xl bg-surface-container-low p-8">
      <p class="mb-4 inline-flex items-center gap-2 rounded-lg bg-primary-soft px-4 py-2 text-xs font-bold uppercase tracking-widest text-primary">
        <span class="material-symbols-outlined text-base">shield_lock</span>
        <span data-i18n="tokens.hero.eyebrow">管理员审计</span>
      </p>
      <h1 class="font-headline mb-3 text-4xl font-extrabold tracking-tight" data-i18n="tokens.hero.title">令牌审计</h1>
      <p class="max-w-3xl text-base leading-8 text-muted" data-i18n="tokens.hero.description">查看已签发的访问令牌、检查过期状态、按条件筛选，并吊销仍在生效的令牌。</p>
    </section>

    <section class="mb-8 grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-4">
      <article class="rounded-xl bg-white p-5 shadow-sm">
        <p class="mb-2 text-sm text-muted" data-i18n="tokens.stats.total">令牌总数</p>
        <p class="text-3xl font-bold" id="statsTotal">0</p>
      </article>
      <article class="rounded-xl bg-white p-5 shadow-sm">
        <p class="mb-2 text-sm text-muted" data-i18n="tokens.stats.active">生效中</p>
        <p class="text-3xl font-bold" id="statsActive">0</p>
      </article>
      <article class="rounded-xl bg-white p-5 shadow-sm">
        <p class="mb-2 text-sm text-muted" data-i18n="tokens.stats.expiring">24 小时内过期</p>
        <p class="text-3xl font-bold" id="statsExpiring">0</p>
      </article>
      <article class="rounded-xl bg-white p-5 shadow-sm">
        <p class="mb-2 text-sm text-muted" data-i18n="tokens.stats.expired">已过期</p>
        <p class="text-3xl font-bold" id="statsExpired">0</p>
      </article>
    </section>

    <div class="mb-6 rounded-xl bg-white p-6 shadow-sm">
      <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <label class="relative w-full lg:max-w-md">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-muted">search</span>
          <input class="w-full rounded-lg border-line py-3 pl-12 pr-4 text-sm" id="searchInput" data-i18n-placeholder="tokens.search.placeholder" placeholder="搜索用户、客户端、scope 或令牌 ID" type="search">
        </label>
        <button class="inline-flex items-center gap-2 rounded-lg border border-line px-4 py-3 text-sm font-bold text-muted hover:text-primary" id="refreshBtn" type="button">
          <span class="material-symbols-outlined text-lg">refresh</span>
          <span data-i18n="common.action.refresh">刷新</span>
        </button>
      </div>
    </div>

    <div class="mb-6 rounded-lg border bg-white px-4 py-3 text-sm text-muted shadow-sm" id="statusBar" data-i18n="tokens.status.loading">正在从 /api/tokens 加载令牌...</div>

    <div class="overflow-hidden rounded-xl bg-white shadow-sm">
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-surface-container-low">
            <tr class="border-b border-line/70">
              <th class="px-5 py-4 text-left font-bold text-muted" data-i18n="tokens.table.client">客户端</th>
              <th class="px-5 py-4 text-left font-bold text-muted" data-i18n="tokens.table.user">用户</th>
              <th class="px-5 py-4 text-left font-bold text-muted" data-i18n="tokens.table.scopes">Scopes</th>
              <th class="px-5 py-4 text-left font-bold text-muted" data-i18n="tokens.table.created">创建时间</th>
              <th class="px-5 py-4 text-left font-bold text-muted" data-i18n="tokens.table.expires">过期时间</th>
              <th class="px-5 py-4 text-left font-bold text-muted" data-i18n="tokens.table.status">状态</th>
              <th class="px-5 py-4 text-left font-bold text-muted" data-i18n="tokens.table.token_id">令牌 ID</th>
              <th class="px-5 py-4 text-right font-bold text-muted" data-i18n="tokens.table.action">操作</th>
            </tr>
          </thead>
          <tbody id="tokenTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/shared/i18n.js?v=20260928-js-1"></script>
  <script src="/js/pages/admin/tokens.js?v=20260928-js-1"></script>
</body>
</html>
