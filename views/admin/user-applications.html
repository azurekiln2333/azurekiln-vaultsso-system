<!DOCTYPE html>
<html class="light" lang="zh-CN" data-admin-page="account-bindings">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultSSO | 用户应用</title>
  <link rel="stylesheet" href="/assets/vaultsso-fonts.css">
  <link rel="stylesheet" href="/css/vaultsso-utilities.css">
  <link rel="stylesheet" href="/css/vaultsso-base.css">
  <link rel="stylesheet" href="/css/vaultsso-admin.css">
  <script src="/js/shared/i18n.js?v=20260928-js-1"></script>
  <script src="/js/shared/admin-shell.js?v=20260928-js-1" defer></script>
  <script src="/js/pages/admin/user-applications.js?v=20260928-js-1" defer></script>
</head>
<body class="vaultsso-page-surface min-h-screen text-ink">
  <main class="admin-main mx-auto max-w-7xl px-6 py-6 lg:px-8">
    <header class="mb-6 flex flex-wrap items-center justify-between gap-4">
      <h1 class="font-headline text-2xl font-extrabold">用户应用</h1>
      <span class="text-sm text-muted" id="bindingsCount"></span>
    </header>
    <div class="mb-6 flex items-center gap-3">
      <label class="relative block min-w-0 flex-1">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-muted" aria-hidden="true">search</span>
        <input class="w-full rounded-lg border-line py-3 pl-12 pr-4 text-sm" id="bindingsSearch" type="search" aria-label="搜索账号应用绑定" placeholder="搜索用户、App、OpenID、UnionID 或主体分组">
      </label>
      <button class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg border border-line bg-white text-muted hover:text-primary disabled:opacity-50" id="bindingsRefresh" type="button" title="刷新" aria-label="刷新">
        <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
      </button>
    </div>
    <p class="mb-6 text-sm text-muted" id="bindingsStatus" role="status" aria-live="polite">正在加载应用...</p>
    <div class="space-y-6" id="bindingsAccounts"></div>
  </main>
</body>
</html>
