<!DOCTYPE html>
<html class="light" lang="zh-CN" data-admin-page="account-bindings">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultSSO | 用户应用</title>
  <link rel="stylesheet" href="/assets/vaultsso-fonts.css">
  <link rel="stylesheet" href="/css/vaultsso-utilities.css">
  <link rel="stylesheet" href="/css/vaultsso-base.css">
  <link rel="stylesheet" href="/css/vaultsso-admin.css">
  <link rel="stylesheet" href="/css/vaultsso-admin-pages.css">
  <script src="/js/shared/i18n.js?v=20260928-js-1"></script>
  <script src="/js/shared/admin-shell.js?v=20260928-js-1" defer></script>
  <script src="/js/pages/admin/user-applications.js?v=20260928-js-1" defer></script>
</head>
<body class="vaultsso-page-surface min-h-screen text-ink">
  <main class="admin-main mx-auto max-w-7xl px-6 py-6 lg:px-8">
    <div class="napi-page-header">
      <p class="napi-page-desc admin-page-desc">按账号查看登录过的应用和第三方应用绑定。</p>
      <span class="napi-badge" id="bindingsCount"></span>
    </div>

    <div class="admin-toolbar-card mb-4">
      <div class="admin-toolbar-row">
        <label class="admin-search">
          <span class="material-symbols-outlined" aria-hidden="true">search</span>
          <input class="napi-input" id="bindingsSearch" type="search" aria-label="搜索账号应用绑定" placeholder="搜索用户、App、OpenID、UnionID 或主体分组">
        </label>
        <button class="napi-btn napi-btn-secondary napi-btn-sm" id="bindingsRefresh" type="button" title="刷新" aria-label="刷新">
          <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
        </button>
      </div>
    </div>

    <p class="admin-status mb-4" id="bindingsStatus" role="status" aria-live="polite">正在加载应用...</p>
    <div class="admin-bindings-list" id="bindingsAccounts"></div>
  </main>
</body>
</html>
