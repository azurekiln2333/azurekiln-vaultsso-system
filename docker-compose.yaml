name: "${COMPOSE_PROJECT_NAME:-azurekiln-oauth2}"

services:
  gateway:
    image: "${GATEWAY_IMAGE:-docker.cnb.cool/azurekiln/azurekiln-oauth2:latest}"
    container_name: "${COMPOSE_PROJECT_NAME:-azurekiln-oauth2}-gateway"
    pull_policy: always
    restart: unless-stopped
    init: true
    # Linux/Baota default: keep the existing loopback MySQL and Nginx boundary.
    network_mode: host
    environment:
      # Deployment .env is mounted below and loaded by the application itself.
      NODE_ENV: production
      HOST: "${HOST:-127.0.0.1}"
      PORT: "${PORT:-3146}"
      DB_BUNDLED: "false"
      ADMIN_SETTINGS_FILE: /app/data/admin-settings.json
      OIDC_SIGNING_KEY_FILE: "${OIDC_SIGNING_KEY_FILE:-data/keys/oidc-private.pem}"
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./data/keys
        target: /app/data/keys
        read_only: true
        bind:
          create_host_path: false
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "${COMPOSE_PROJECT_NAME:-azurekiln-oauth2}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  watchtower:
    image: nickfedor/watchtower:1.23.2
    profiles: [auto-update]
    restart: unless-stopped
    # Target only this gateway, in addition to label opt-in and project scope.
    command: ["${COMPOSE_PROJECT_NAME:-azurekiln-oauth2}-gateway"]
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: "${COMPOSE_PROJECT_NAME:-azurekiln-oauth2}"
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-600}"
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "${COMPOSE_PROJECT_NAME:-azurekiln-oauth2}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
