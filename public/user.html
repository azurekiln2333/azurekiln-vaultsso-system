<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultSSO | 用户详情</title>
  <script src="/assets/vaultsso-tailwind.js"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/vaultsso-base.css">
</head>
<body class="vaultsso-page-surface min-h-screen text-ink">
  <div class="mx-auto max-w-7xl px-6 py-6 lg:px-8">
    <header class="mb-8 flex flex-col gap-5 rounded-xl border border-white/80 bg-white/75 px-6 py-5 shadow-sm backdrop-blur lg:flex-row lg:items-center lg:justify-between">
      <div class="flex items-center gap-4">
        <div class="flex h-12 w-12 items-center justify-center rounded-xl primary-gradient text-xl font-black text-white">V</div>
        <div>
          <p class="font-headline text-2xl font-extrabold tracking-tight text-primary">VaultSSO</p>
          <p class="text-sm text-muted">用户目录与权限管理</p>
        </div>
      </div>
      <nav class="flex flex-wrap items-center gap-3 text-sm font-semibold">
        <a class="rounded-lg px-3 py-2 text-muted hover:bg-white hover:text-primary" href="/users.html">用户</a>
        <a class="rounded-lg px-3 py-2 text-muted hover:bg-white hover:text-primary" href="/apps.html">应用</a>
        <a class="rounded-lg px-3 py-2 text-muted hover:bg-white hover:text-primary" href="/tokens.html">令牌</a>
        <a class="rounded-lg px-3 py-2 text-muted hover:bg-white hover:text-primary" href="/api-docs.html">API 文档</a>
        <a class="rounded-lg px-3 py-2 text-muted hover:bg-white hover:text-primary" href="/profile">个人资料</a>
      </nav>
    </header>

    <section class="mb-6">
      <a class="mb-4 inline-flex items-center gap-1 text-sm font-bold text-muted hover:text-primary" href="/users.html"><span class="material-symbols-outlined text-lg">arrow_back</span>返回用户列表</a>
      <h1 class="font-headline text-3xl font-extrabold tracking-tight">用户详情</h1>
      <p class="mt-2 text-base text-muted">查看并编辑该账户的基本资料、角色和邮箱验证状态。</p>
    </section>

    <div class="mb-6 rounded-lg border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-blue-700" id="statusBar">正在加载用户信息...</div>

    <div class="grid grid-cols-1 gap-6 lg:grid-cols-5">
      <section class="space-y-5 lg:col-span-2">
        <article class="rounded-xl bg-white p-6 shadow-sm">
          <div class="flex items-center gap-4">
            <img class="h-20 w-20 rounded-2xl object-cover bg-primary-soft" id="detailAvatar" alt="avatar">
            <div class="min-w-0">
              <p class="font-headline truncate text-2xl font-extrabold tracking-tight" id="detailName">...</p>
              <p class="mt-1 break-all text-sm text-muted" id="detailUsername"></p>
            </div>
          </div>
          <div class="mt-4 flex flex-wrap gap-2">
            <span class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-bold" id="roleBadge"></span>
            <span class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-bold" id="verifiedBadge"></span>
          </div>
          <code class="mt-4 block break-all rounded-lg bg-surface-container-low px-3 py-2 text-xs text-muted" id="detailId"></code>
        </article>

        <article class="rounded-xl bg-white p-6 shadow-sm">
          <p class="mb-4 inline-flex items-center gap-2 text-sm font-bold text-muted"><span class="material-symbols-outlined text-lg">link</span>第三方账号绑定</p>
          <div class="space-y-2" id="identityList"></div>
        </article>

        <article class="grid grid-cols-2 gap-4">
          <div class="rounded-xl bg-white p-4 shadow-sm">
            <p class="mb-1 text-xs font-bold uppercase tracking-widest text-muted">创建时间</p>
            <p class="text-sm font-semibold" id="detailCreatedAt">-</p>
          </div>
          <div class="rounded-xl bg-white p-4 shadow-sm">
            <p class="mb-1 text-xs font-bold uppercase tracking-widest text-muted">最近更新</p>
            <p class="text-sm font-semibold" id="detailUpdatedAt">-</p>
          </div>
        </article>
      </section>

      <section class="lg:col-span-3">
        <article class="rounded-xl bg-white p-6 shadow-sm">
          <p class="mb-5 inline-flex items-center gap-2 text-sm font-bold text-muted"><span class="material-symbols-outlined text-lg">edit</span>编辑资料</p>
          <form class="space-y-5" id="userEditForm">
            <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
              <label class="block">
                <span class="mb-1 block text-sm font-bold text-muted">显示名称</span>
                <input class="w-full rounded-lg border-line text-sm" id="nameInput" name="name" type="text" required>
              </label>
              <label class="block">
                <span class="mb-1 block text-sm font-bold text-muted">邮箱</span>
                <input class="w-full rounded-lg border-line text-sm" id="emailInput" name="email" type="email" required>
              </label>
              <label class="block sm:col-span-2">
                <span class="mb-1 block text-sm font-bold text-muted">头像 URL</span>
                <input class="w-full rounded-lg border-line text-sm" id="avatarInput" name="avatar" type="url" placeholder="https://example.com/avatar.png">
                <span class="mt-1 block text-xs text-muted">留空将使用系统默认头像。</span>
              </label>
              <label class="block">
                <span class="mb-1 block text-sm font-bold text-muted">角色</span>
                <select class="w-full rounded-lg border-line py-2.5 pl-3 pr-9 text-sm" id="roleInput" name="role">
                  <option value="user">普通用户</option>
                  <option value="admin">管理员</option>
                </select>
              </label>
              <label class="flex items-center gap-3 self-end pb-2">
                <input class="h-4 w-4 rounded accent-primary" id="verifiedInput" name="emailVerified" type="checkbox">
                <span class="text-sm font-bold text-muted">邮箱已验证</span>
              </label>
            </div>
            <div class="rounded-lg bg-surface-container-low px-4 py-3 text-xs text-muted">用户名 <span id="usernameHint" class="font-bold"></span> 已锁定，无法修改。</div>
            <button class="inline-flex items-center gap-2 rounded-lg bg-primary px-5 py-3 text-sm font-bold text-white hover:opacity-90 disabled:opacity-50" id="saveBtn" type="submit"><span class="material-symbols-outlined text-lg">save</span>保存修改</button>
          </form>
        </article>
      </section>
    </div>
  </div>

  <script>
    const statusBar = document.getElementById('statusBar');
    const editForm = document.getElementById('userEditForm');
    const saveBtn = document.getElementById('saveBtn');
    let currentUserId = '';

    function escapeHtml(value) { return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    function dateText(value) { const date = new Date(value); return Number.isNaN(date.getTime()) ? '未记录' : date.toLocaleString('zh-CN'); }
    function setStatus(kind, message) {
      statusBar.className = `mb-6 rounded-lg border px-4 py-3 text-sm ${kind === 'error' ? 'border-red-200 bg-red-50 text-red-700' : kind === 'success' ? 'border-green-200 bg-green-50 text-green-700' : 'border-blue-200 bg-blue-50 text-blue-700'}`;
      statusBar.textContent = message;
    }
    function buildAvatarDataUri(name) {
      const initial = (name || 'U').trim().charAt(0).toUpperCase() || 'U';
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><rect width="80" height="80" rx="16" fill="#0b57d0"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="32" font-family="Segoe UI, Arial, sans-serif" font-weight="700">${escapeHtml(initial)}</text></svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }
    function setAvatar(url, name) {
      const avatar = document.getElementById('detailAvatar');
      avatar.onerror = function () { avatar.src = buildAvatarDataUri(name); };
      avatar.src = url || buildAvatarDataUri(name);
    }
    function renderUser(user) {
      setAvatar(user.avatar, user.name || user.username);
      document.getElementById('detailName').textContent = user.name || '未设置姓名';
      document.getElementById('detailUsername').textContent = user.username || '';
      document.getElementById('detailId').textContent = user.id || '';
      document.getElementById('usernameHint').textContent = user.username || '';

      const roleBadge = document.getElementById('roleBadge');
      roleBadge.className = `inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-bold ${user.role === 'admin' ? 'bg-primary-soft text-primary' : 'bg-surface-container-low text-muted'}`;
      roleBadge.innerHTML = `<span class="material-symbols-outlined text-sm">${user.role === 'admin' ? 'admin_panel_settings' : 'person'}</span>${user.role === 'admin' ? '管理员' : '普通用户'}`;
      const verifiedBadge = document.getElementById('verifiedBadge');
      verifiedBadge.className = `inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-bold ${user.emailVerified ? 'bg-green-50 text-green-700' : 'bg-amber-50 text-amber-700'}`;
      verifiedBadge.innerHTML = `<span class="material-symbols-outlined text-sm">${user.emailVerified ? 'mark_email_read' : 'mark_email_unread'}</span>${user.emailVerified ? '邮箱已验证' : '邮箱未验证'}`;

      document.getElementById('detailCreatedAt').textContent = dateText(user.createdAt);
      document.getElementById('detailUpdatedAt').textContent = dateText(user.updatedAt);

      const identities = Array.isArray(user.identities) ? user.identities : [];
      const list = document.getElementById('identityList');
      list.innerHTML = identities.length
        ? identities.map(identity => `<div class="flex items-center justify-between gap-3 rounded-lg border border-line/70 px-3 py-2"><span class="inline-flex items-center gap-2 text-sm font-bold text-ink"><span class="material-symbols-outlined text-base text-primary">key</span>${escapeHtml(identity.provider)}</span><span class="truncate text-xs text-muted" title="${escapeHtml(identity.providerUserId)}">${escapeHtml(identity.providerUsername || identity.providerUserId)}</span></div>`).join('')
        : '<p class="text-sm text-muted">该账户未绑定第三方账号。</p>';

      document.getElementById('nameInput').value = user.name || '';
      document.getElementById('emailInput').value = user.email || '';
      document.getElementById('avatarInput').value = user.avatar || '';
      document.getElementById('roleInput').value = user.role === 'admin' ? 'admin' : 'user';
      document.getElementById('verifiedInput').checked = Boolean(user.emailVerified);
    }
    async function request(url, options = {}) {
      const response = await fetch(url, { credentials: 'same-origin', ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
      const payload = response.status === 204 ? null : await response.json();
      if (response.status === 401) { window.location.href = '/oauth2/authorize'; throw new Error('登录已过期'); }
      if (response.status === 403) { window.location.href = '/oauth2/error?error=access_denied'; throw new Error('没有权限'); }
      if (!response.ok) throw new Error(payload?.error_description || '请求失败');
      return payload;
    }
    async function loadUser() {
      const params = new URLSearchParams(window.location.search);
      currentUserId = params.get('id') || '';
      if (!currentUserId) { setStatus('error', '缺少用户 ID，请从用户列表进入。'); return; }
      try {
        const payload = await request(`/api/users/${encodeURIComponent(currentUserId)}`);
        renderUser(payload.user);
        setStatus('info', `正在查看用户：${payload.user.name || payload.user.username || payload.user.id}`);
      } catch (error) { setStatus('error', error.message); }
    }
    editForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!currentUserId) return;
      saveBtn.disabled = true;
      try {
        const payload = await request(`/api/users/${encodeURIComponent(currentUserId)}`, {
          method: 'PUT',
          body: JSON.stringify({
            name: document.getElementById('nameInput').value.trim(),
            email: document.getElementById('emailInput').value.trim(),
            avatar: document.getElementById('avatarInput').value.trim(),
            role: document.getElementById('roleInput').value,
            emailVerified: document.getElementById('verifiedInput').checked
          })
        });
        renderUser(payload.user);
        setStatus('success', '用户信息已保存。');
      } catch (error) { setStatus('error', error.message); }
      finally { saveBtn.disabled = false; }
    });
    loadUser();
  </script>
</body>
</html>
